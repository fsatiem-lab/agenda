<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faby Gestão de Projetos</title>
  <link rel="icon" href="https://ssl.gstatic.com/calendar/images/dynamiclogo_2020q4/calendar_23_2x.png" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fdf8f7;
    }
    /* Corta automaticamente os 38px superiores onde o Google Apps Script exibe a tarja de aviso */
    .iframe-wrapper {
      position: fixed;
      top: -38px;
      left: 0;
      width: 100vw;
      height: calc(100vh + 38px);
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="iframe-wrapper">
    <iframe
      src="https://script.google.com/macros/s/AKfycbxiB_VfZWBUEn9zIo0ys_Vuez8UtdEuixe2L7ZvfoY5poMn6X56-LygdBW0Qgfmni4COA/exec"
      allow="clipboard-read; clipboard-write"
      title="Faby Gestão de Projetos">
    </iframe>
  </div>
</body>
</html>
